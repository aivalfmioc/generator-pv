<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice List</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.4rem; }
    header a { color: #cfe0f5; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; min-width: 240px; }
    #status { color: #666; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #e9eef5; font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; }
    td.num, th.num { text-align: right; }
    tr.invoice-row { cursor: pointer; }
    tr.invoice-row:hover { background: #f6f9fc; }
    tr.details td { background: #fafbfc; }
    tr.details table { box-shadow: none; }
    .empty { text-align: center; color: #888; padding: 24px; }
  </style>
</head>
<body>
  <header>
    <h1>Invoices</h1>
    <a href="/pdf.html">Invoice Generator</a>
  </header>
  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search invoice number or company...">
      <span id="status">Loading...</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Invoice #</th>
          <th>Date</th>
          <th>Due</th>
          <th>Seller</th>
          <th>Buyer</th>
          <th class="num">VAT</th>
          <th class="num">Net</th>
          <th class="num">Total</th>
        </tr>
      </thead>
      <tbody id="invoice-body"></tbody>
    </table>
  </main>
  <script src="invoices.js"></script>
</body>
</html>
