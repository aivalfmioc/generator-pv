<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoices</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      background: #f4f6f8;
      color: #1f2937;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      background: #fff;
      border-bottom: 1px solid #dfe3e8;
    }
    h1 {
      margin: 0;
      font-size: 24px;
    }
    main {
      padding: 24px 32px 40px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    button {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #1f2937;
      padding: 8px 14px;
      cursor: pointer;
    }
    button.active {
      border-color: #2563eb;
      background: #2563eb;
      color: #fff;
    }
    #status {
      margin-left: auto;
      color: #64748b;
    }
    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 180px);
      border: 1px solid #dfe3e8;
      border-radius: 8px;
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e8ecf0;
      text-align: left;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      color: #475569;
      font-weight: 700;
    }
    tbody tr:hover {
      background: #f8fafc;
    }
  </style>
</head>
<body>
  <header>
    <h1>Invoices</h1>
    <a href="/pdf.html">Invoice Generator</a>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" class="table-button" data-table="companies">Companies</button>
      <button type="button" class="table-button active" data-table="invoices">Invoices</button>
      <button type="button" class="table-button" data-table="invoice_items">Invoice items</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>
  <script src="/database.js"></script>
</body>
</html>
